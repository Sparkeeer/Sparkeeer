<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200">
  <style>
    .sans{font-family:Inter,'Segoe UI',Helvetica,Arial,sans-serif}
    .leaf{fill:#ffb070;opacity:0}
    .l1{animation:fall 18s linear infinite}
    .l2{animation:fall 22s linear infinite 9s}
    @keyframes fall{
      0%{transform:translate(0,-24px) rotate(0);opacity:0}
      12%{opacity:.4}
      88%{opacity:.4}
      100%{transform:translate(-20px,230px) rotate(280deg);opacity:0}
    }
  </style>

  <rect width="1200" height="200" rx="14" fill="#14130f"/>

  <!-- leaves -->
  <g transform="translate(140,0)"><path class="leaf l1" d="M12 2C6 6 4 12 6 18c3 3.5 9 3.5 12 0C20 12 18 6 12 2z"/></g>
  <g transform="translate(1040,0)"><path class="leaf l2" d="M12 2C6 6 4 12 6 18c3 3.5 9 3.5 12 0C20 12 18 6 12 2z"/></g>

  <!-- text -->
  <text x="600" y="88" text-anchor="middle" class="sans" font-size="50" font-weight="600" letter-spacing="-1.5" fill="#e8e3d5"><tspan fill="#8fa8c8">Hi</tspan>, I'm Shakeer<tspan fill="#c4452d">.</tspan></text>
  <text x="600" y="130" text-anchor="middle" class="sans" font-size="24" font-weight="500" letter-spacing="-.4" fill="#8fa8c8">Microsoft 365 &amp; Cloud Engineer</text>
  <text x="600" y="166" text-anchor="middle" class="sans" font-size="15" letter-spacing="2" fill="#9b9485">IDENTITY  ·  MIGRATIONS  ·  AUTOMATION</text>
</svg>